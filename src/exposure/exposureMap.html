<div id="map"></div>
<aside class="panel" aria-label="Exposure animation controls">
  <h1>Hazard exposure</h1>
  <p id="intro"></p>

  <div class="seg" role="group" aria-label="Hazard">
    <button type="button" data-mode="slr" class="on">Sea level rise</button>
    <button type="button" data-mode="surge">Storm surge</button>
    <button type="button" data-mode="heat">Surface heat</button>
  </div>

  <div class="player">
    <button type="button" class="play" id="play" aria-label="Play">▶</button>
    <input type="range" id="slider" aria-label="Scenario" />
  </div>

  <div class="readout">
    <div class="big" id="big">–</div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="stats">
    <div><div class="n" id="stat1">–</div><div class="l" id="stat1-l"></div></div>
    <div><div class="n" id="stat2">–</div><div class="l" id="stat2-l"></div></div>
  </div>

  <div class="seg" role="group" aria-label="What the map colors">
    <button type="button" data-view="hazard" class="on">Hazard extent</button>
    <button type="button" data-view="people">Population exposure</button>
  </div>
  <div id="ramp-wrap">
    <div class="ramp" id="ramp"></div>
    <div class="ramp-labels" id="ramp-labels"></div>
    <p class="ramp-note" id="ramp-note"></p>
  </div>

  <h2>Projects (completed, ongoing, funded)</h2>
  <div class="seg" role="group" aria-label="Which projects to show">
    <button type="button" data-show="all" class="on">All projects</button>
    <button type="button" data-show="matching" id="show-matching">Flood &amp; storm</button>
  </div>
  <label class="field">Infrastructure type
    <select id="infra">
      <option value="all">All types</option>
      <option value="Green Infrastructure">Green</option>
      <option value="Blue Infrastructure">Blue</option>
      <option value="Hybrid">Hybrid</option>
      <option value="Gray Infrastructure">Gray</option>
    </select>
  </label>
  <div class="legend" id="legend"></div>
  <div class="seg" role="group" aria-label="Project symbols">
    <button type="button" data-pins="columns" class="on">3D columns</button>
    <button type="button" data-pins="dots">Flat dots</button>
  </div>

  <details class="more">
    <summary>How to read this</summary>
    <p id="howto"></p>
    <div class="caveat" id="caveat"></div>
  </details>

  <details class="more">
    <summary>Data source</summary>
    <div class="src" id="source"></div>
  </details>
</aside>
