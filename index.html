<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="SCALE-R is an NSF-funded University of Miami initiative that maps coastal adaptation interventions and models disaster risk reduction across Miami-Dade County."
    />
    <title>Miami-Dade Climate Resilience Dashboard</title>

    <script>
      /* Route-scoped hints. This document is served for every path, so an
         unconditional preconnect or image preload would fetch dashboard-only
         origins (and the About hero) on routes that never use them. */
      (function () {
        var path = location.pathname.replace(/\/+$/, '') || '/';

        if (path === '/dashboard') {
          ;[
            'https://api.mapbox.com',
            'https://mmlqltdcpsuxirbqhugw.supabase.co',
          ].forEach(function (origin) {
            var pre = document.createElement('link');
            pre.rel = 'preconnect';
            pre.href = origin;
            pre.crossOrigin = '';
            document.head.appendChild(pre);
          });
          return;
        }

        if (path !== '/' && path !== '/about') return;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        /* imageSrcset/imageSizes must mirror the <img> exactly. If the preload
           named a single file instead, a phone would fetch the 3200w original
           here and then the 1200w candidate for the image itself — downloading
           both and making things worse than no preload at all. */
        link.imageSrcset =
          '/Images/about-scale-r-hero-1200.webp 1200w, /Images/about-scale-r-hero-1920.webp 1920w, /Images/about-scale-r-hero.webp 3200w';
        link.imageSizes = '100vw';
        link.href = '/Images/about-scale-r-hero-1920.webp';
        link.fetchPriority = 'high';
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <!-- Set early so first paint can use full-bleed widths under classic scrollbars (100vw is often wrong). -->
    <script>
      (function () {
        function syncScrollbarWidth() {
          var d = document.documentElement;
          d.style.setProperty(
            '--scrollbar-width',
            Math.max(0, window.innerWidth - d.clientWidth) + 'px',
          );
        }
        syncScrollbarWidth();
        window.addEventListener('resize', syncScrollbarWidth);
        /* Tab focus / overlay scrollbars: innerWidth − clientWidth can change without a resize event. */
        window.addEventListener('pageshow', syncScrollbarWidth);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState !== 'visible') return;
          syncScrollbarWidth();
          requestAnimationFrame(function () {
            syncScrollbarWidth();
          });
        });
        /* Classic scrollbar show/hide can change clientWidth without a window resize (e.g. after tab focus). */
        if (typeof ResizeObserver !== 'undefined') {
          try {
            new ResizeObserver(syncScrollbarWidth).observe(document.documentElement);
          } catch (e) {
            /* ignore */
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
