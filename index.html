<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Miami-Dade Climate Resilience Dashboard</title>
    
    <!-- Google Fonts: Manrope + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Mapbox serves both the stylesheet below and every map tile; Supabase
         serves the project GeoJSON, which is requested as soon as the map
         loads. Opening both connections early only moves the handshake
         earlier, it does not change what is requested. -->
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link rel="preconnect" href="https://mmlqltdcpsuxirbqhugw.supabase.co" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />

    <!-- Mapbox CSS -->
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />

    <script>
      /* The /about hero is the LCP element, but React renders it, so the
         preload scanner never sees it in the initial HTML and the request
         waits for the bundle to execute. Injecting the preload here starts it
         immediately.

         It is route-scoped on purpose: this index.html is served for every
         route, and an unconditional preload would pull the 1.8 MB hero down on
         /dashboard, /team and everywhere else that never renders it. It is also
         placed after the stylesheet links above so the render-blocking CSS is
         queued first — an image competing with those delays first paint, which
         costs more than the LCP it buys. */
      (function () {
        var path = location.pathname.replace(/\/+$/, '') || '/';
        if (path !== '/' && path !== '/about') return;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        /* imageSrcset/imageSizes must mirror the <img> exactly. If the preload
           named a single file instead, a phone would fetch the 3200w original
           here and then the 1200w candidate for the image itself — downloading
           both and making things worse than no preload at all. */
        link.imageSrcset =
          '/Images/about-scale-r-hero-1200.webp 1200w, /Images/about-scale-r-hero.webp 3200w';
        link.imageSizes = '100vw';
        link.href = '/Images/about-scale-r-hero.webp';
        link.fetchPriority = 'high';
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <!-- Set early so first paint can use full-bleed widths under classic scrollbars (100vw is often wrong). -->
    <script>
      (function () {
        function syncScrollbarWidth() {
          var d = document.documentElement;
          d.style.setProperty(
            '--scrollbar-width',
            Math.max(0, window.innerWidth - d.clientWidth) + 'px',
          );
        }
        syncScrollbarWidth();
        window.addEventListener('resize', syncScrollbarWidth);
        /* Tab focus / overlay scrollbars: innerWidth − clientWidth can change without a resize event. */
        window.addEventListener('pageshow', syncScrollbarWidth);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState !== 'visible') return;
          syncScrollbarWidth();
          requestAnimationFrame(function () {
            syncScrollbarWidth();
          });
        });
        /* Classic scrollbar show/hide can change clientWidth without a window resize (e.g. after tab focus). */
        if (typeof ResizeObserver !== 'undefined') {
          try {
            new ResizeObserver(syncScrollbarWidth).observe(document.documentElement);
          } catch (e) {
            /* ignore */
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
